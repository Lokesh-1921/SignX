# WLASL-300 baseline experiment
# 300-class subset for intermediate-scale benchmarking.
# Requires: WLASL_v0.3.json + videos under data/raw/wlasl/

experiment:
  name: wlasl300_baseline
  seed: 42
  output_dir: experiments/runs
  checkpoint_dir: checkpoints

data:
  train_manifest: data/manifests/wlasl300/train.jsonl
  val_manifest: data/manifests/wlasl300/val.jsonl
  num_frames: 16
  frame_size: [224, 224]
  batch_size: 12
  num_workers: 4
  pin_memory: true
  labels: []

  augmentation:
    random_crop: true
    crop_scale: [0.8, 1.0]
    random_horizontal_flip: false
    color_jitter: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
    random_rotation: true
    rotation_degrees: 10.0
    random_erasing: true
    erasing_probability: 0.25
    erasing_scale: [0.02, 0.12]
    temporal_crop: true
    temporal_crop_fraction: [0.85, 1.0]
    speed_perturbation: true
    speed_range: [0.85, 1.15]

model:
  name: SignBridge-WLASL300-v1
  num_classes: 300
  hidden_dim: 256
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.15
  use_pose: false
  pose_dim: 0

training:
  batch_size: 12
  epochs: 150
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  checkpoint_every: 10
  resume: null

  scheduler:
    type: cosine_warmup
    warmup_epochs: 10
    min_lr_ratio: 0.005

evaluation:
  topk: [1, 5]
