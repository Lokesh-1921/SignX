[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signbridge"
version = "0.1.0"
description = "Research platform for context-aware sign language video understanding"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "PyYAML>=6.0",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
tracking = ["tensorboard>=2.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["datasets", "preprocessing", "models", "models.vision", "models.pose", "models.temporal", "models.fusion", "models.vlm", "models.translation", "training", "evaluation"]
